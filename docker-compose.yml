services:
  app:
    build: .
    image: 4texecutive:latest
    container_name: 4texecutive
    restart: unless-stopped
    ports:
      - "8200:8200"
    env_file:
      - .env
    volumes:
      - ./config:/app/config:rw,z
      - ./metrics.db:/app/metrics.db:rw,z
      - ./certs:/app/certs:ro,z
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request, ssl; urllib.request.urlopen('https://localhost:8200/login', context=ssl._create_unverified_context(), timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
