<!doctype html>
<html data-theme="{{ request.cookies.get('theme', 'light') }}">
<head>
  <meta charset="utf-8">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>4tExecutive</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <nav>
    <span class="nav-brand">4tExecutive</span>
    <a href="{{ url_for('dashboard.index') }}">Dashboard</a>
    {% if session.username and user_has_tab(session.username, 'admin') %}
      <a href="{{ url_for('admin.sources') }}">Admin</a>
    {% endif %}
    <span class="nav-spacer"></span>
    <form method="post" action="{{ url_for('theme.set_theme') }}" class="theme-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="next" value="{{ request.path }}">
      {% if request.cookies.get('theme', 'light') == 'dark' %}
        <input type="hidden" name="theme" value="light">
        <button type="submit" class="theme-toggle" aria-label="Switch to light mode">☀️</button>
      {% else %}
        <input type="hidden" name="theme" value="dark">
        <button type="submit" class="theme-toggle" aria-label="Switch to dark mode">🌙</button>
      {% endif %}
    </form>
    {% if session.username %}
      <a href="{{ url_for('auth.logout') }}">Logout</a>
    {% endif %}
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
