[project]
name = "4texecutive"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3,<4",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "bcrypt>=5.0.0",
    "apscheduler>=3.11.3",
    "flask-wtf>=1.3.0",
    "flask-limiter>=4.1.1",
    "cryptography>=50.0.1",
]

[project.optional-dependencies]
prod = ["gunicorn>=26.1.0"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# BLE001 (no blind `except Exception`) is intentionally off: the collector's
# "catch, log, degrade gracefully" convention relies on it so one source
# outage never crashes the poll loop or takes down other sources.
ignore = ["BLE001"]
