[project]
name = "4texecutive"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3,<4",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "bcrypt>=5.0.0",
    "apscheduler>=3.11.3",
]

[project.optional-dependencies]
prod = ["gunicorn>=26.1.0"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
